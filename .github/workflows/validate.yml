name: Validar KRONOS Linux

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      AVALONIA_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: dotnet restore Kronos.sln --locked-mode
      - run: python engines/memory/setup_engine.py --target .tools/memory
      - run: dotnet build Kronos.sln -c Release --no-restore
      - run: dotnet run --project tests/Kronos.SmokeTests -c Release --no-build
      - run: dotnet run --project tests/Kronos.DesktopTests -c Release --no-build
      - run: dotnet run --project tests/Kronos.MemoryTests -c Release --no-build -- --real-engine
      - run: python tests/test_legacy.py
      - run: python tests/test_sync_git.py
      - run: python tests/test_forensics.py
  linux-package:
    needs: tests
    runs-on: ubuntu-24.04
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      AVALONIA_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preparar aplicación nativa y motores Linux
        run: python scripts/setup-linux.py
      - name: Crear paquete sin evidencias ni entornos Python no portables
        run: python scripts/bundle-linux.py
      - uses: actions/upload-artifact@v4
        with:
          name: KRONOS-Linux
          path: artifacts/KRONOS-Linux.zip
          retention-days: 14
